<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><title>余生 · 手机交互预览</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 40%,#2c3125,#10130e 70%);color:#e6ddcd;font:13px system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;flex-direction:column;padding:28px 15px 35px}header{display:flex;align-items:center;gap:35px;flex-wrap:wrap;justify-content:center;margin-bottom:23px}h1{font-size:16px;font-weight:400;letter-spacing:2px;margin:0}h1 span{color:#cfab83}nav{display:flex;gap:6px}button,a{font:12px system-ui;color:#bcbca7;background:transparent;border:1px solid #b7b38b33;padding:9px 14px;border-radius:4px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#d4b38d;color:#1b2415;border-color:#d4b38d}.device{width:var(--phone-width,390px);height:min(844px,calc(100vh - 145px));min-height:580px;border:7px solid #353a30;border-radius:35px;overflow:hidden;box-sizing:content-box;box-shadow:0 30px 100px #0009;position:relative;transition:width .25s;background:#121610}iframe{width:100%;height:100%;border:0;display:block}p{font-size:11px;color:#8d9a7b;margin:20px 0 0;line-height:1.8;text-align:center}@media(max-width:600px){body{padding:0}header,p{display:none}.device{border:0;border-radius:0;width:100%!important;height:100dvh;min-height:0}}
</style></head><body><header><h1>余生 <span>移动端交互预览</span></h1><nav aria-label="预览尺寸"><button data-width="360" aria-pressed="false">360</button><button data-width="390" aria-pressed="true">390</button><button data-width="430" aria-pressed="false">430</button></nav><a href="/">打开完整页面 ↗</a></header><div class="device"><iframe src="/" title="余生手机预览" allow="autoplay; fullscreen" allowfullscreen></iframe></div><p>可直接操作 · 在手机中打开首页即可自动适配<br>电脑预览仅模拟屏幕尺寸；多点触控以手机实机为准。</p><script type="module">document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{document.querySelector('.device').style.setProperty('--phone-width',button.dataset.width+'px');document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});</script></body></html>
